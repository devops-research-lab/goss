name: Golang ci
on:
  push: null
permissions:
  contents: read
  pull-requests: read
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.59
  coverage:
    needs:
    - lint
    name: coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Unit tests and coverage
      run: make cov
  integration-test:
    needs:
    - coverage
    name: Integration tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Integration tests
      shell: bash
      run: "os_name=\"$(go env GOOS)\"\nif [[ \"${os_name}\" == \"darwin\" || \"${os_name}\" == \"windows\"\
        \ ]]; then\n  make \"test-int-${os_name}-all\"\nelse\n  # linux runs all tests;\n  make test-int-all\n\
        fi\n"
